[project]
name = "garantiafacil"
version = "0.1.0"
description = "Organizador de notas fiscais e garantias, projeto de estudo de LLM, RAG e agentes"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "mcp>=2.3.0",
    "ollama",
    "opencv-python-headless",
    "pydantic",
    "pypdf",
    "python-dotenv",
    "streamlit",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garantiafacil"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
